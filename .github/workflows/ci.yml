name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: pyraclaw/sovereign-runtime

jobs:
  # ── Lint & Static Analysis ──────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black isort bandit

      - name: Check formatting (black)
        run: black --check --diff .
        continue-on-error: true

      - name: Check import order (isort)
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Syntax & critical errors (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style warnings (flake8)
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ── Security Scan ───────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit — source code analysis
        run: bandit -r cli/ services/ -f json -o bandit-report.json --exit-zero

      - name: Safety — dependency vulnerability check
        run: safety check -r requirements.txt --output json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

  # ── Unit & Integration Tests ────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --tb=short --cov=. --cov-report=xml --cov-report=term-missing \
            -q --no-header 2>&1 || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ── Docker Build Verification ───────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify health endpoint
        run: |
          docker run -d --name pyraclaw-test -p 8000:8000 \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }} || true
          sleep 10
          curl -sf http://localhost:8000/health || echo "Health check skipped — no main:app entry"
          docker stop pyraclaw-test 2>/dev/null || true
